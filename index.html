<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Defender: ภารกิจพิทักษ์ข้อมูล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #090d16; color: #fff; touch-action: manipulation; }
        #gameCanvas { background: radial-gradient(circle, #1e1b4b 0%, #0f172a 100%); border: 2px solid #38bdf8; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Screen 1: Login -->
    <div id="loginScreen" class="w-full max-w-md bg-slate-900 border border-slate-700 p-6 rounded-2xl shadow-2xl text-center">
        <div class="text-5xl mb-3">🚀</div>
        <h1 class="text-3xl font-bold text-cyan-400 mb-2">CYBER DEFENDER</h1>
        <p class="text-slate-400 text-sm mb-6">เกมแอ็กชันควบคุมยานคัดแยกข้อมูล & กำจัดมัลแวร์</p>
        
        <input type="text" id="playerName" placeholder="พิมพ์ชื่อผู้เล่น..." 
               class="w-full p-3 rounded-lg bg-slate-800 border border-slate-600 text-cyan-300 font-bold mb-4 focus:outline-none focus:border-cyan-400 text-center text-lg">
        
        <button onclick="startGame()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-lg text-lg transition shadow-lg shadow-cyan-500/30">
            เข้าสู่ระบบและเริ่มภารกิจ
        </button>
    </div>

    <!-- Screen 2: Game Arcade -->
    <div id="gameContainer" class="hidden flex flex-col items-center w-full max-w-md">
        <!-- HUD -->
        <div class="w-full bg-slate-900 border border-slate-700 p-3 rounded-t-xl flex justify-between items-center text-sm font-bold">
            <div>👤 <span id="hudName" class="text-cyan-400">Player</span></div>
            <div>❤️ HP: <span id="hudHP" class="text-red-400">3</span></div>
            <div>⚡ XP: <span id="hudXP" class="text-yellow-400">0</span></div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas" width="360" height="480" class="w-full"></canvas>

        <!-- Controls for Mobile & PC -->
        <div class="w-full bg-slate-900 border border-slate-700 p-3 rounded-b-xl grid grid-cols-3 gap-2">
            <button onmousedown="moveLeft()" ontouchstart="moveLeft()" class="bg-slate-800 border border-slate-600 active:bg-cyan-600 p-3 rounded-lg text-xl font-bold">⬅️ ซ้าย</button>
            <button onclick="shoot()" class="bg-red-600 active:bg-red-500 p-3 rounded-lg font-bold text-white shadow-lg">💥 ยิงยิง!</button>
            <button onmousedown="moveRight()" ontouchstart="moveRight()" class="bg-slate-800 border border-slate-600 active:bg-cyan-600 p-3 rounded-lg text-xl font-bold">ขวา ➡️</button>
        </div>
        <p class="text-xs text-slate-500 mt-2">คำแนะนำ: เก็บ [สีเขียว=ข้อมูล] | ยิงหรือหลบ [สีแดง=ภัยคุกคาม] | เก็บ [สีเหลือง=CC]</p>
    </div>

    <!-- Screen 3: Game Over / Victory -->
    <div id="resultScreen" class="hidden w-full max-w-md bg-slate-900 border border-slate-700 p-6 rounded-2xl shadow-2xl text-center">
        <div id="resultIcon" class="text-6xl mb-2">🏆</div>
        <h2 id="resultTitle" class="text-3xl font-bold mb-2">จบภารกิจ!</h2>
        <p class="text-slate-400 mb-4">ผู้เล่น: <span id="resName" class="text-cyan-400 font-bold"></span></p>

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6">
            <div class="text-sm text-slate-400">คะแนน XP ที่ทำได้</div>
            <div id="resXP" class="text-4xl font-bold text-yellow-400 my-1">0</div>
            <div id="resBadge" class="text-xs font-bold text-cyan-300 mt-2">ได้รับเหรียญ: -</div>
        </div>

        <button onclick="location.reload()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg">
            เล่นใหม่อีกครั้ง
        </button>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 150, y: 420, width: 60, height: 20, speed: 25 };
    let bullets = [];
    let items = [];
    let score = 0;
    let hp = 3;
    let playerName = "";
    let isGameOver = false;
    let gameLoopId;

    // ข้อมูลจากบทเรียนที่ถูกแปลงเป็น Object ในเกม
    const itemPool = [
        // ของดี: ข้อมูล (Data) -> ต้องใช้ยานรับ
        { text: "ข้อความดิบ", type: "data", color: "#4ade80" },
        { text: "ตัวเลขดิบ", type: "data", color: "#4ade80" },
        { text: "ไฟล์ภาพ", type: "data", color: "#4ade80" },
        { text: "ไฟล์เสียง", type: "data", color: "#4ade80" },
        
        // ของอันตราย: ภัยคุกคาม (Malware) -> ต้องยิงทำลาย หรือหลบ
        { text: "Ransomware", type: "threat", color: "#f87171" },
        { text: "Trojan", type: "threat", color: "#f87171" },
        { text: "Spyware", type: "threat", color: "#f87171" },
        { text: "Worm ไวรัส", type: "threat", color: "#f87171" },

        // โบนัส: สิทธิและลิขสิทธิ์ (CC) -> เก็บได้ XP สูง
        { text: "CC-BY", type: "bonus", color: "#facc15" },
        { text: "CC-NC", type: "bonus", color: "#facc15" }
    ];

    function startGame() {
        const nameInput = document.getElementById("playerName").value.trim();
        if(!nameInput) return alert("กรุณาใส่ชื่อก่อนเริ่มเล่น!");
        
        playerName = nameInput;
        document.getElementById("hudName").innerText = playerName;
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("gameContainer").classList.remove("hidden");

        // Controls Keyboard
        window.addEventListener("keydown", (e) => {
            if(e.key === "ArrowLeft") moveLeft();
            if(e.key === "ArrowRight") moveRight();
            if(e.key === " ") shoot();
        });

        setInterval(spawnItem, 1200);
        gameLoop();
    }

    function moveLeft() { if(player.x > 0) player.x -= player.speed; }
    function moveRight() { if(player.x < canvas.width - player.width) player.x += player.speed; }

    function shoot() {
        if(isGameOver) return;
        bullets.push({ x: player.x + player.width / 2 - 3, y: player.y, width: 6, height: 12 });
    }

    function spawnItem() {
        if(isGameOver) return;
        const template = itemPool[Math.floor(Math.random() * itemPool.length)];
        items.push({
            x: Math.random() * (canvas.width - 80),
            y: -30,
            width: 80,
            height: 26,
            speed: 2 + Math.random() * 1.5,
            ...template
        });
    }

    function gameLoop() {
        if(isGameOver) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Player Ship
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.roundRect(player.x, player.y, player.width, player.height, 8);
        ctx.fill();

        // Draw Bullets
        ctx.fillStyle = "#ef4444";
        bullets.forEach((b, index) => {
            b.y -= 7;
            ctx.fillRect(b.x, b.y, b.width, b.height);
            if(b.y < 0) bullets.splice(index, 1);
        });

        // Draw Falling Items
        items.forEach((item, iIndex) => {
            item.y += item.speed;

            // Box style
            ctx.fillStyle = item.color;
            ctx.beginPath();
            ctx.roundRect(item.x, item.y, item.width, item.height, 5);
            ctx.fill();

            // Text style inside Box
            ctx.fillStyle = "#000";
            ctx.font = "bold 11px Prompt";
            ctx.textAlign = "center";
            ctx.fillText(item.text, item.x + item.width/2, item.y + 17);

            // Bullet vs Item Collision (ยิงทำลาย)
            bullets.forEach((b, bIndex) => {
                if(b.x < item.x + item.width && b.x + b.width > item.x &&
                   b.y < item.y + item.height && b.y + b.height > item.y) {
                    
                    if(item.type === "threat") {
                        score += 100; // ยิงไวรัสได้คะแนน
                    } else {
                        score = Math.max(0, score - 50); // ยิงข้อมูลตัวเองโดนหักคะแนน
                    }
                    items.splice(iIndex, 1);
                    bullets.splice(bIndex, 1);
                    updateHUD();
                }
            });

            // Player Catch Item Collision (ยานชนขอบไอเทม)
            if(player.x < item.x + item.width && player.x + player.width > item.x &&
               player.y < item.y + item.height && player.y + player.height > item.y) {
                
                if(item.type === "data") {
                    score += 150; // รับข้อมูลสำเร็จ (ประมวลผล)
                } else if(item.type === "bonus") {
                    score += 200; // เก็บ CC ได้โบนัส
                } else if(item.type === "threat") {
                    hp--; // ชนไวรัส เลือดลด
                }
                
                items.splice(iIndex, 1);
                updateHUD();

                if(hp <= 0) endGame();
            }

            // Fall Off Screen
            if(item.y > canvas.height) {
                items.splice(iIndex, 1);
            }
        });

        gameLoopId = requestAnimationFrame(gameLoop);
    }

    function updateHUD() {
        document.getElementById("hudXP").innerText = score;
        document.getElementById("hudHP").innerText = hp;
    }

    function endGame() {
        isGameOver = true;
        cancelAnimationFrame(gameLoopId);
        document.getElementById("gameContainer").classList.add("hidden");
        document.getElementById("resultScreen").classList.remove("hidden");

        document.getElementById("resName").innerText = playerName;
        document.getElementById("resXP").innerText = score;

        let badge = "🛡️ ผู้พิทักษ์ฝึกหัด";
        if(score >= 1000) badge = "👑 Cyber Master (ระดับเชี่ยวชาญ)";
        else if(score >= 500) badge = "🥇 Cyber Knight (ระดับนักพิทักษ์)";
        
        document.getElementById("resBadge").innerText = "ฉายาที่ได้รับ: " + badge;
    }
</script>
</body>
</html>
